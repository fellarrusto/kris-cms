<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="wip-body">
  <main class="status-page wip-page">
    <div class="container status-inner">
      <p class="wordmark" aria-label="Kris">
        <svg class="wordmark-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6"/><path d="M8.5 6.5v11M15.5 6.5 9.2 12.4l6.6 5.1"/></svg>
        <span>Kris</span>
      </p>
      <h1>{{title}}</h1>
      <p class="status-text">{{text}}</p>
    </div>
  </main>
</body>
</html>
