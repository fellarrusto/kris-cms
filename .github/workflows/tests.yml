# Suite dei test a ogni push e pull request.
# Controlla la versione minima della 2.0 (8.3) e la successiva,
# con le estensioni che servono all'updater: senza sodium e zip le suite
# dei pacchetti verrebbero saltate.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, json, sodium, zip, curl, gd, exif, pdo_sqlite
          coverage: none

      - name: Sintassi PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Test
        run: php tests/run.php

      - name: Nessuna suite saltata
        run: "! php tests/run.php | grep -q '^SALTATA'"

  editor:
    # kris/editor/dist/ è versionato (sugli hosting non c'è Node): deve corrispondere ai sorgenti in admin-src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-src/package-lock.json

      - name: Dipendenze
        working-directory: admin-src
        run: npm ci

      - name: Compila l'editor
        working-directory: admin-src
        run: npm run build

      - name: L'editor compilato è aggiornato
        run: |
          if [ -n "$(git status --porcelain -- kris/editor/dist)" ]; then
            git status --short -- kris/editor/dist
            echo "kris/editor/dist/ non corrisponde ai sorgenti: esegui npm run build in admin-src/ e versiona il risultato."
            exit 1
          fi
